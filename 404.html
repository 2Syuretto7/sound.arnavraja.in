<style>
:root { --paper: #F2F3EF; --ink: #16211F; --muted: #56625D; --rule: #D1D6CF; --accent: #3337A8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #111513; --ink: #E7EBE7; --muted: #9AA59F; --rule: #2B332F; --accent: #A3A7FF; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #111513; --ink: #E7EBE7; --muted: #9AA59F; --rule: #2B332F; --accent: #A3A7FF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { width: 100%; max-width: 60rem; margin: 0 auto; padding-inline: clamp(0px, 3vw, 2rem); }
.label { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin: 0 0 1rem; }
.label b { color: var(--accent); font-weight: 500; }
h1 { font-weight: 800; font-size: clamp(3rem, 10vw, 7rem); line-height: 0.9; letter-spacing: -0.045em; margin: 0; }

.home:hover { color: var(--accent); border-bottom-color: var(--accent); }
.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
